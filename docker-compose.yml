version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgehub
      POSTGRES_PASSWORD: forgehub_secret
      POSTGRES_DB: forgehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehub -d forgehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgehub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/docker/Dockerfile
    container_name: forgehub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FORGEHUB_ENV: production
      FORGEHUB_PORT: 8080
      FORGEHUB_HOST: 0.0.0.0
      DATABASE_URL: postgres://forgehub:forgehub_secret@postgres:5432/forgehub?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GIT_ROOT_DIR: /data/git
      SESSION_SECRET: change_this_in_production_32_bytes_super_secure!
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    volumes:
      - git_data:/data/git
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/docker/Dockerfile
    container_name: forgehub-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  git_data:
